name: lesgo

on:
  repository_dispatch:
    types: [cron-tick]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create scheduled test commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          messages=(
            "chore(repo): update source code and project files"
            "docs: improve project documentation"
            "test: refresh automated tests"
            "build: maintain project configuration"
          )
          message="${messages[$RANDOM % ${#messages[@]}]}"
          git commit --allow-empty -m "$message"
          git push
